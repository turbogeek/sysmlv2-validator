# Grammar coverage minimums (GrammarCoverageTest). These values may only go up: when a change raises the coverage,
# raise the minimum to the new figure, floored to three decimals; never lower one to make a build pass. Add a snippet
# to grammar-snippets for anything valid SysML v2 can exercise, or a note to grammar-coverage-notes.properties for
# what it cannot. The figures are in target/grammar-coverage/report.md after the test runs.
#
# repo.*     the repository's corpus: test-suite, examples and grammar-snippets (no other checkout needed)
# official.* the repository's corpus with the OMG SysML-v2-Release sysml/src models and kerml/src examples
#
# 2026-10-25, grammar at 9775388 plus contextSuperClass: repository 253/270 rules, 446/574 alternatives, 243/251
# tokens; with the release 254/270, 448/574, 243/251. Every rule, alternative and token that the repository corpus
# does not cover has a note (100% of what valid input can reach).
repo.rules=0.937
repo.alternatives=0.777
repo.tokens=0.968
official.rules=0.940
official.alternatives=0.780
official.tokens=0.968
