# Known reference performance for timing tests (com.validator.testutil.PerformanceReference).
#
# The reference workload is fixed CPU and memory work that does not use the validator, so its time measures how fast
# the machine is right now: battery power can throttle the CPU and other programs compete for it. A run measures the
# workload before and after the timed work and uses the slower median.
#
# reference.nominalMs: the workload's median time on the development machine at full speed. Re-record it on AC
# power with nothing heavy running:  java validator-core/src/test/java/com/validator/testutil/PerformanceReference.java
# 2026-09-21, AC power, two JVMs x three measurements: medians 22.9 23.0 23.6 / 21.5 22.7 21.1 ms (median 22.8,
# +-6% between measurements); spread (slowest over median of 7 runs) 1.07-1.30.
reference.nominalMs=22.8

# The build-time budget of one model at full speed. It scales with measured / nominal reference (at least 1), so a
# throttled machine gets a proportionally larger budget and a slower validator still fails, and with the spread of
# the reference in the same run, which estimates how much the machine's speed varies right now.
budget.nominalMs=1500

# Models known to exceed the budget because the validator is slow on them (a validator defect, not a machine
# effect), with the largest allowed ratio of build time to the reference median: they may not get slower. Each limit
# allows about twice the worst ratio observed on 2026-09-21 (12 runs, reference 18-31 ms). Remove a model once it
# meets the budget. Other models are timed three more times on the warm JVM and the median must meet the budget;
# their warm medians on 2026-09-21: StockTicker_SolutionDomain 864-1265 ms, StockTicker_ProblemDomain_WhiteBox
# 525-815 ms, StockTicker_ImplementationDomain 224-327 ms.
# 12_simple_vehicle_model.sysml: 20237-33365 ms, 677-1224 x the reference; same with the lexer from before a38a6c4.
knownSlow.12_simple_vehicle_model.sysml=2300
# StockTickerSystem.sysml: 3442-5064 ms, 121-187 x the reference. Hidden until 2026-09-21, because the test stopped
# at its first failing model.
knownSlow.StockTickerSystem.sysml=350
