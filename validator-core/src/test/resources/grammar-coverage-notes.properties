# Why grammar elements are not covered (com.validator.testutil.GrammarCoverageReport, GrammarCoverageTest).
#
# Keys: rule.<parser rule>, alt.<parser rule>#<outer alternative, 1-based>, token.<token type>. The coverage report
# shows the reason next to an uncovered element. Every element that valid SysML v2 or KerML can exercise should have a
# snippet in grammar-snippets instead of a note; a note is for what valid input cannot reach:
#   shadowed  - an earlier alternative accepts the same input with the same meaning, so this one is never chosen
#   bug       - an earlier alternative accepts a prefix and the rest parses as another element, so valid input gets
#               the wrong tree without a syntax error (ShadowedAlternativeTest, disabled until the grammar is fixed)
#   not SysML - a validator extension that is not in the OMG BNF (SysML-textual-bnf.kebnf, KerML-textual-bnf.kebnf)
#   gap       - valid SysML v2 that no parser rule accepts, so it is a syntax error (gaps without a token of their
#               own, such as unary '+' or 'all T', have no element to note here; GrammarGapTest lists them)
# References are to the SysML v2 and KerML specification clauses that the BNF files are taken from.

# ---- Rules ----
rule.importFilter=not SysML: ': :' between 'import' and the imported name is not in the BNF (SysML v2 8.2.2.5.2)
rule.annotationArguments=not SysML: '@M(...)' with arguments; a metadata usage has a body, not arguments (SysML v2 8.2.2.27)
rule.annotationArgument=not SysML: see annotationArguments
rule.constraintParameter=shadowed: 'x : T;' in a constraint body parses as implicitFeatureDeclaration (constraintBodyElement#1)
rule.tupleOrValueInit=shadowed: only attributeUsage#2 uses it, and attributeUsage#1 shadows that alternative
rule.refKind=shadowed: in 'ref part p;' member takes 'ref' as a prefix and the rest as a part usage before it tries refUsage
rule.expressionList=unused: no parser rule refers to expressionList
rule.parameterValueInit=shadowed: featureRelationships (valueInit) takes '= e' and ':= e' first; '= (n = e)' is not SysML
rule.simpleParameter=shadowed: 'x : T;', 'subject : T;' and 'objective : T;' parse as implicitFeatureDeclaration, subjectDeclaration and objectiveRequirement in namespaceBodyElement, which comes first
rule.metaExpression=not SysML: 'meta T' after a redefinition without a value; with '= e meta T' the expression takes it
rule.flowStatement=shadowed: 'first a then b;' and 'then b;' parse as successionUsage in namespaceBodyElement > member, which every body that allows statements tries first; 'start' and 'done' are names
rule.assignmentStatement=shadowed: 'x = e;' and 'x := e;' parse as implicitFeatureDeclaration; '+=' and a dotted target are not SysML (assignment is 'assign a.b := e;')
rule.acceptStatement=shadowed: 'accept ...;' parses as acceptUsage in namespaceBodyElement > member, which every body that allows statements tries first
rule.doStatement=not SysML: 'do action' outside a state body; in a state body doAction comes first
rule.thisExpression=shadowed: 'this' is a name (name#5), so nameExpression takes it first; SysML v2 has no 'this' expression
rule.invocationExpression=shadowed: 'f(x)' parses as nameExpression with the invocation suffix (sequenceSuffix#8)
rule.documentationBody=not SysML: a string after 'doc', 'comment' or 'rep'; the body is a /* */ comment (SysML v2 8.2.2.4.2), which the lexer skips

# ---- Alternatives ----
alt.viewpointBodyElement#3=shadowed by #1: namespaceBodyElement > member has concernUsage
alt.constraintDefBodyElement#2=shadowed by #1: namespaceBodyElement > member has attributeUsage
alt.attributeDefinition#2=shadowed by #1: definitionBody includes ';'
alt.metadataDefinition#2=bug: 'metadata def Tag;' parses as an unnamed 'metadata def' and a feature 'Tag;'
alt.individualDefinition#2=shadowed by #1: definitionBody includes ';'
alt.partUsage#2=shadowed by #1: every element of #1 after 'part' is optional
alt.partUsage#3=shadowed by #1: usageBody includes ';'
alt.actionUsage#5=shadowed by #4: usageBody includes ';'
alt.constraintUsage#2=bug: 'constraint c;' parses as an unnamed 'constraint' and a feature 'c;'
alt.constraintUsage#4=bug: 'assert constraint c;' parses as an unnamed 'assert constraint' and a feature 'c;'
alt.constraintBodyElement#5=shadowed by #1: namespaceBodyElement > member has attributeUsage
alt.constraintBodyElement#6=shadowed by #1: see rule constraintParameter
alt.attributeUsage#2=shadowed by #1: featureRelationships includes 'redefines'
alt.portUsage#2=shadowed by #1: every element of #1 after 'port' is optional
alt.portUsage#3=shadowed by #1: usageBody includes ';'
alt.connectionUsage#2=shadowed by #1: usageBody includes ';'
alt.flowConnectionUsage#2=shadowed by #1: usageBody includes ';'
alt.transitionUsage#2=shadowed by #1: transitionRelationships is 'first expression'
alt.transitionUsage#4=not SysML: 'a transition b' is not a transition usage (SysML v2 8.2.2.18.3)
alt.includeUsage#3=shadowed by #2: usageBody includes ';'
alt.actorUsage#2=shadowed by #1: usageBody includes ';'
alt.stakeholderUsage#2=shadowed by #1: usageBody includes ';'
alt.concernUsage#2=bug: 'concern c;' parses as an unnamed 'concern' and a feature 'c;'
alt.concernBodyElement#2=shadowed by #1: namespaceBodyElement > member has subjectDeclaration
alt.concernBodyElement#3=shadowed by #1: namespaceBodyElement > member has stakeholderUsage
alt.occurrenceUsage#4=shadowed by #3: usageBody includes ';'
alt.occurrenceUsage#6=shadowed by #5: usageBody includes ';'
alt.occurrenceUsage#8=shadowed by #7: usageBody includes ';'
alt.occurrenceUsage#9=bug: 'event a.b;' parses as an unnamed 'event' and an expression statement 'a.b;'
alt.variantUsage#2=shadowed by #1: usageBody includes ';'
alt.portionUsage#2=shadowed by #1: usageBody includes ';'
alt.stepUsage#2=shadowed by #1: usageBody includes ';'
alt.interfaceUsage#2=shadowed by #1: usageBody includes ';'
alt.messageUsage#2=shadowed by #1: usageBody includes ';'
alt.metadataUsage#2=bug: 'metadata Tag;' parses as an unnamed 'metadata' and a feature 'Tag;'
alt.endUsage#2=shadowed by #1: usageBody includes ';'
alt.endUsage#3=bug: 'end inCart [0..1] item cart : Cart[1];' parses as 'end inCart [0..1]' and a separate item usage
alt.endUsage#4=shadowed by #3, which the bug of #3 makes unreachable as well
alt.endUsage#5=shadowed by #1: every element of #1 after 'end' is optional
alt.declarationName#3=shadowed by #2: 'shortName name?'
alt.usageName#3=shadowed by #2: 'shortName name?'
alt.featureRelationship#5=not SysML: 'readonly' after a name; SysML v2 does not reserve 'readonly' and has the 'constant' prefix
alt.featureRelationship#6=not SysML: 'portion' after a name; KerML has 'portion' only as a prefix (KerML 8.2.4.3)
alt.multiplicityRange#2=shadowed by #1: multiplicityBound#1 is '*'
alt.successionEndpoints#3=bug: SysML v2 needs 'first' ('succession s first a then b;', SysML v2 8.2.2.13.3), but KerML's 'succession a then b;' (KerML 8.2.5.5.3) is valid and parses as 'succession a', with 'a' as its name, and a separate 'then b;'
alt.simpleFeature#2=shadowed: 'feature ...' parses as featureDefinition in namespaceBodyElement > member, which comes first
alt.simpleFeature#3=shadowed: see simpleFeature#2
alt.simpleFeature#4=shadowed: see simpleFeature#2
alt.simpleFeature#5=shadowed: see simpleFeature#2
alt.inParameter#2=shadowed by #1: usageBody includes ';'
alt.outParameter#2=shadowed by #1: usageBody includes ';'
alt.inoutParameter#2=shadowed by #1: usageBody includes ';'
alt.usageBodyElement#8=shadowed by #1: namespaceBodyElement > member has subjectDeclaration
alt.usageBodyElement#9=shadowed by #1: namespaceBodyElement > member has objectiveRequirement
alt.usageBodyElement#10=shadowed: see rule simpleParameter
alt.usageBodyElement#11=shadowed by #1: namespaceBodyElement has metadataAnnotation
alt.stateBodyElement#5=shadowed by #1: namespaceBodyElement > member has transitionUsage
alt.requirementBodyElement#2=shadowed by #1: namespaceBodyElement > member has subjectDeclaration
alt.requirementBodyElement#6=shadowed by #1: namespaceBodyElement > member has objectiveRequirement
alt.requirementBodyElement#14=shadowed: see rule simpleParameter
alt.requirementBodyElement#15=shadowed by #1: namespaceBodyElement has metadataAnnotation
alt.viewBodyElement#4=shadowed by #1: namespaceBodyElement has filterStatement
alt.enumMember#2=bug: 'enum red { }' parses as an unnamed 'enum' and a second value 'red { }'
alt.subjectDeclaration#3=bug: 'subject v : V { }' parses as 'subject v : V' and an expression statement '{ }'
alt.requireConstraint#2=shadowed by #1: its optional expression takes 'require a.b;'
alt.verifyRequirement#2=bug: 'verify r.req;' parses as an unnamed 'verify' and an expression statement 'r.req;'
alt.statement#1=shadowed: see rule assignmentStatement
alt.statement#7=shadowed: 'send ...;' parses as sendUsage in namespaceBodyElement > member, which comes first
alt.statement#8=shadowed: see rule acceptStatement
alt.statement#9=shadowed: see rule flowStatement
alt.statement#11=shadowed: namespaceBodyElement > member has invariantStatement
alt.statement#13=shadowed: 'assign x := e;' parses as assignUsage in namespaceBodyElement > member, which comes first
alt.statement#14=not SysML: see rule doStatement
alt.thenStatement#6=shadowed by #5: usageBody includes ';'
alt.thenStatement#12=shadowed by #11: stateUsageBody includes ';'
alt.thenStatement#14=shadowed by #13: usageBody includes ';'
alt.thenStatement#15=bug: 'then event a.b;' parses as 'then event' and an expression statement 'a.b;' (as occurrenceUsage#9)
alt.thenStatement#20=shadowed: 'then e;' parses as successionUsage#2 in namespaceBodyElement > member, and in a statement list as flowStatement#2, which come first
alt.terminateStatement#2=shadowed by #1: a name is an expression
alt.unaryExpression#2=not SysML: '!' is not a SysML v2 operator; the unary operators are '+', '-', '~' and 'not' (KerML 8.2.5.8.1)
alt.baseExpression#3=shadowed: see rule invocationExpression
alt.baseExpression#7=shadowed: see rule thisExpression
alt.baseExpression#8=shadowed by #2: 'start' is a name (name#4)
alt.baseExpression#9=shadowed by #2: 'done' is a name (name#3)

# ---- Tokens ----
token.DEFINED_BY=gap: no parser rule uses it, so 'part p defined by P;' (DEFINED_BY = ':' | 'defined' 'by', SysML v2 8.2.2.1.2) is a syntax error
token.TYPED_BY=gap: no parser rule uses it, so 'metadata m typed by M;' (SysML v2 8.2.2.27) and KerML 'typed by' are syntax errors
token.CROSSES_OP=gap: no parser rule uses it, so cross subsetting 'end a => b;' (CROSSES = '=>' | 'crosses', SysML v2 8.2.2.6.5) is a syntax error
token.TRIPLE_COLON=not SysML: ':::' is not a SysML v2 or KerML symbol and no parser rule uses it
token.PLUS_EQUALS=not SysML: '+=' (assignmentStatement) is not a SysML v2 operator; assignment is 'assign x := e'
token.BANG=not SysML: '!' (unaryExpression#2) is not a SysML v2 operator; negation is 'not'
token.HEX_INTEGER=not SysML: KerML has only decimal and exponent numeric literals (KerML 8.2.2.4)
token.BINARY_INTEGER=not SysML: KerML has only decimal and exponent numeric literals (KerML 8.2.2.4)
token.DECIMAL=unreachable: REAL matches the same text ('1.5') and comes first in the lexer, so the lexer never produces DECIMAL
